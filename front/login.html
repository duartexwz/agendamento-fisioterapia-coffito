<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agendamento Saúde Ocupacional</title>
    <link rel="stylesheet" href="./src/css/login.css">
    <link rel="stylesheet" href="./src/css/modal.css">
</head>
<body>
    <main class="login-pagina">
        <div class="login-fundo" aria-hidden="true"></div>

        <section class="login-card" aria-labelledby="titulo-login">
            <div class="login-marca">
                <img src="./src/assets/coffito-nova-logo.webp" alt="Logo COFFITO">
                <div>
                    <span class="login-kicker">AGENDAMENTO ONLINE</span>
                    <h1 id="titulo-login">Painel administrativo</h1>
                    <p>Acesse com suas credenciais para gerenciar sessões e profissionais.</p>
                </div>
            </div>

            <form class="login-form" id="formLogin" novalidate>
                <label for="emailLogin">E-mail</label>
                <div class="campo-com-icone">
                    <input
                        id="emailLogin"
                        name="email"
                        type="email"
                        placeholder="seuemail@coffito.gov.br"
                        autocomplete="username"
                        required
                    >
                </div>

                <label for="senhaLogin">Senha</label>
                <div class="campo-com-icone campo-senha">
                    <input
                        id="senhaLogin"
                        name="senha"
                        type="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="botao-ver-senha" id="botaoVerSenha" aria-label="Mostrar senha">
                        Mostrar
                    </button>
                </div>

                <button type="submit" class="botao-entrar" id="botaoEntrar">
                    Entrar
                </button>
            </form>

            <div class="login-rodape">
                <span>Acesso restrito à equipe autorizada.</span>
            </div>
        </section>
    </main>

    <script type="module" src="./src/js/ui/login.js"></script>
</body>
</html>
