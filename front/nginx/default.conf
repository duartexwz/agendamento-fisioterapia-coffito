# Configuração do nginx do container front.
#
# - "/"             → serve os arquivos estáticos (HTML/CSS/JS do painel).
# - "/api/v1"       → repassa para a API Node no serviço "api" (rede do
#   docker-compose), fazendo as chamadas same-origin funcionarem para
#   qualquer host/porta de acesso (localhost, IP da rede, nome da máquina).
server {
    listen 65;

    location /api/v1 {
        proxy_pass http://api:3025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
